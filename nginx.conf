server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Coolify's proxy terminates HTTPS in front of this container, so keep
    # redirects relative instead of pointing at http://<host>:80/...
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # /impressum/ -> /impressum
        rewrite ^/(.+)/$ /$1 permanent;
        # The export writes both impressum.html and an impressum/ folder,
        # so $uri.html must be tried before $uri/ or the page returns 403.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
